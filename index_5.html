<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Báo cáo bán hàng KV2</title>

<!-- ===== DÁN LINK APPS SCRIPT CỦA BẠN VÀO 2 CHỖ CÓ CHỮ HOA BÊN DƯỚI ===== -->
<meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbzzhTc3H_kPMgru8ma7GtcscnlnkqdEzLLcGwYjFLxM2UWHVfTVDBoGlr14mPVHGGGP/exec">
<link rel="canonical" href="https://script.google.com/macros/s/AKfycbzzhTc3H_kPMgru8ma7GtcscnlnkqdEzLLcGwYjFLxM2UWHVfTVDBoGlr14mPVHGGGP/exec">

<style>
  :root{
    --teal-900:#083A3C;
    --teal-600:#0E7C7B;
    --teal-300:#4ECDC4;
    --paper:#F7FBFB;
    --ink:#0B2426;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
    background:var(--paper);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    text-align:center;
  }
  .wrap{max-width:340px;width:100%}

  /* Giọt nước — đổ đầy dần trong lúc chờ chuyển trang */
  .drop{
    width:64px;height:64px;
    margin:0 auto 28px;
    position:relative;
    border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    border:2px solid var(--teal-600);
    overflow:hidden;
  }
  .drop::after{
    content:"";
    position:absolute;
    left:0;right:0;bottom:0;
    height:0;
    background:var(--teal-300);
    animation:fill 1.4s ease-in-out infinite;
  }
  @keyframes fill{
    0%{height:0}
    70%{height:100%}
    100%{height:100%}
  }

  h1{
    font-size:19px;
    font-weight:600;
    letter-spacing:-.01em;
    color:var(--teal-900);
    margin-bottom:8px;
  }
  p{
    font-size:14px;
    line-height:1.5;
    color:#5A7274;
    margin-bottom:22px;
  }
  a.btn{
    display:inline-block;
    padding:11px 22px;
    background:var(--teal-600);
    color:#fff;
    text-decoration:none;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
  }
  a.btn:hover{background:var(--teal-900)}
  a.btn:focus-visible{outline:3px solid var(--teal-300);outline-offset:2px}

  @media (prefers-reduced-motion:reduce){
    .drop::after{animation:none;height:70%}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="drop"></div>
    <h1>Đang mở ứng dụng báo cáo</h1>
    <p>Nếu sau vài giây trang chưa tự chuyển, bấm nút bên dưới.</p>
    <a class="btn" href="https://script.google.com/macros/s/AKfycbzzhTc3H_kPMgru8ma7GtcscnlnkqdEzLLcGwYjFLxM2UWHVfTVDBoGlr14mPVHGGGP/exec">Mở ngay</a>
  </div>

<script>
  location.replace("https://script.google.com/macros/s/AKfycbzzhTc3H_kPMgru8ma7GtcscnlnkqdEzLLcGwYjFLxM2UWHVfTVDBoGlr14mPVHGGGP/exec");
</script>
</body>
</html>
